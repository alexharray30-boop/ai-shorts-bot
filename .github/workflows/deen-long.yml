name: Islamic channel - 8 minute video (Tue + Fri)

# Tuesday and Friday 13:00 UTC = 6 PM Pakistan: the video is ready and indexed
# before the evening peak (8-10 PM Pakistan time). No Shorts on these days (see deen.yml).
# Order: 99 Naam 1-33, Roz ki Duaen, 99 Naam 34-66, Qurani Duaen, 99 Naam 67-99, then again.

on:
  schedule:
    - cron: "0 13 * * 2,5"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = make only (download from Artifacts), upload = upload now"
        type: choice
        options: [test, upload]
        default: test

permissions:
  contents: write

concurrency:
  group: deen-channel
  cancel-in-progress: false

jobs:
  long:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CHANNEL: deen
      RENDER_SCALE: "0.5"   # 1920x1080
      YT4_CLIENT_ID: ${{ secrets.YT4_CLIENT_ID }}
      YT4_CLIENT_SECRET: ${{ secrets.YT4_CLIENT_SECRET }}
      YT4_REFRESH_TOKEN: ${{ secrets.YT4_REFRESH_TOKEN }}
      PRIVACY_STATUS: ${{ vars.DEEN_PRIVACY_STATUS || 'public' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install FFmpeg, Arabic font and text shaping
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-hosny-amiri fonts-noto-core fonts-sil-scheherazade pango1.0-tools
      - name: Make (and upload) the 8 minute video
        run: |
          if [ "${{ inputs.mode }}" = "test" ]; then
            python bot/main.py --dry-run --deen-long
          else
            python bot/main.py --force --deen-long
          fi
      - name: Keep the video + thumbnail for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deen-long-${{ github.run_id }}
          path: |
            out/long-*.mp4
            out/long-*.jpg
          retention-days: 3
          if-no-files-found: ignore
      - name: Save history
        if: always()
        run: |
          git config user.name "ai-shorts-bot"
          git config user.email "ai-shorts-bot@users.noreply.github.com"
          git add state/ || true
          git diff --cached --quiet || (git commit -m "bot: upload log" && (git push || (git pull --rebase && git push)))
