name: Kismat Kahaniyan - Make Suspense Series Bank

# Renders the suspense series parts in order (10 stories x 10 parts, ~1 minute each) with realistic
# Cloudflare images, until the free daily allowance is used up, and continues the next day.
# Parts go to "series-bank" (uploaded one by one, then deleted) and "series-archive" (kept, used to build
# the long videos). When a story's last part is made, its "Poori Kahani" long video goes to "series-long-bank".

on:
  schedule:
    - cron: "30 1 * * *"   # every day 01:30 UTC (Cloudflare's free allowance resets at 00:00 UTC)
  workflow_dispatch:
    inputs:
      max:
        description: "max parts in this run"
        default: "40"
      only:
        description: "test: render only this part (e.g. s01p01) - nothing is published"
        default: ""

permissions:
  contents: write

concurrency:
  group: series-bank
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      CHANNEL: story
      CF_STEPS: "6"
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_ACCOUNT: ${{ vars.CF_ACCOUNT }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Releases and the list of parts already made
        run: |
          for r in series-bank series-archive series-long-bank; do
            gh release view $r >/dev/null 2>&1 || gh release create $r --title "$r" --latest=false --notes "Kismat Kahaniyan suspense series"
          done
          gh release view series-archive --json assets -q '.assets[].name' > done.txt || true
          echo "parts already made: $(grep -c '\.mp4$' done.txt || true)"
      - name: Render parts (stops at the daily Cloudflare limit)
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            python tools/series_bank.py --only "${{ inputs.only }}" --out test --long-out test
          else
            python tools/series_bank.py --done done.txt --max "${{ inputs.max || '40' }}" --out bank --long-out longbank
          fi
      - name: Keep test output (Actions -> run -> Artifacts)
        if: inputs.only != ''
        uses: actions/upload-artifact@v4
        with:
          name: series-test-${{ github.run_id }}
          path: test/
          retention-days: 3
      - name: Publish parts and long videos
        if: inputs.only == ''
        run: |
          if ls bank/*.mp4 >/dev/null 2>&1; then
            for i in 1 2 3; do gh release upload series-archive bank/* --clobber && break || sleep 20; done
            for i in 1 2 3; do gh release upload series-bank bank/* --clobber && break || sleep 20; done
          fi
          if ls longbank/*.mp4 >/dev/null 2>&1; then
            for i in 1 2 3; do gh release upload series-long-bank longbank/* --clobber && break || sleep 20; done
          fi
          echo "parts waiting to be uploaded: $(gh release view series-bank --json assets -q '.assets[].name' | grep -c '\.mp4$' || true)"
          echo "long videos waiting: $(gh release view series-long-bank --json assets -q '.assets[].name' | grep -c '\.mp4$' || true)"
