name: Riddle Shorts Bot (4K)

on:
  schedule:
    - cron: "17 * * * *"   # checks every hour; 3 Shorts a day (7.5h gap), 2 on long-video days Mon/Wed/Fri (11h gap)
  workflow_dispatch:
    inputs:
      mode:
        description: "test = make video only (download from Artifacts), upload = upload now"
        type: choice
        options: [test, upload]
        default: test

permissions:
  contents: write

concurrency:
  group: ai-shorts-bot
  cancel-in-progress: false

jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MIN_HOURS_BETWEEN_UPLOADS: "23"  # 1 a day: this channel gets almost no views, its quota goes to Dimagh Lagao
      VIDEO_SECONDS: "10"
      PRIVACY_STATUS: ${{ vars.PRIVACY_STATUS || 'public' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Long-video day? Then one Short less
        # Mon/Wed/Fri the long kids video also uses this Google project's quota
        # (quota day = Pacific time). 11h gap -> 2 Shorts + 1 long + 3 Dimagh Lagao = 6.
        run: |
          DOW=$(TZ=America/Los_Angeles date +%u)
          if [ "$DOW" = "1" ] || [ "$DOW" = "3" ] || [ "$DOW" = "5" ]; then
            echo "MIN_HOURS_BETWEEN_UPLOADS=23" >> "$GITHUB_ENV"
            echo "Long-video day: 11h gap (2 Shorts today)"
          else
            echo "Normal day: 7.5h gap (3 Shorts today)"
          fi

      - name: Is an upload due?
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "15 16 20 11 *" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            python bot/main.py --check-only
          fi

      - name: Install FFmpeg
        if: steps.check.outputs.due == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Make (and upload) the Short
        if: steps.check.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ inputs.mode }}" = "test" ]; then
            python bot/main.py --dry-run
            exit 0
          fi
          # 1) next ready-made video from the video bank, if any
          NEXT=$(gh release view video-bank --json assets -q '[.assets[].name | select(endswith(".mp4"))] | sort | .[0] // empty' 2>/dev/null || true)
          if [ -n "$NEXT" ]; then
            echo "Uploading from video bank: $NEXT"
            mkdir -p dl
            gh release download video-bank -p "$NEXT" -p "${NEXT%.mp4}.json" -D dl --clobber
            python bot/main.py --force --video "dl/$NEXT" --meta "dl/${NEXT%.mp4}.json"
            gh release delete-asset video-bank "$NEXT" -y
            gh release delete-asset video-bank "${NEXT%.mp4}.json" -y || true
          else
            # 2) bank empty: make a fresh video now
            echo "Video bank is empty - making a new video"
            python bot/main.py --force
          fi

      - name: Keep the video for 3 days (Actions -> run -> Artifacts)
        if: steps.check.outputs.due == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_id }}
          path: out/
          retention-days: 3
          if-no-files-found: ignore

      - name: Save history
        if: steps.check.outputs.due == 'true'
        run: |
          git config user.name "ai-shorts-bot"
          git config user.email "ai-shorts-bot@users.noreply.github.com"
          git add state/ || true
          git diff --cached --quiet || (git commit -m "bot: upload log" && (git push || (git pull --rebase && git push)))
