name: AI Adventure Kids - Long Videos (4K, TV)

# Mon / Wed / Fri: makes one 4-6 minute landscape learning video (ABC A-Z, 24 animals,
# counting, odd one out - rotating) and uploads it to the kids channel.

on:
  schedule:
    - cron: "0 13 * * 1,3,5"   # 13:00 UTC = 8 AM New York / 1 PM London
  workflow_dispatch:
    inputs:
      format:
        description: "abc, guess_animal, count, odd_one_out or auto"
        default: auto
      mode:
        description: "test = make only (download from Artifacts), upload = upload"
        type: choice
        options: [upload, test]
        default: upload

permissions:
  contents: write

concurrency:
  group: kids-long
  cancel-in-progress: false

jobs:
  long:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      PRIVACY_STATUS: ${{ vars.PRIVACY_STATUS || 'public' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Make (and upload) the long video
        run: |
          FMT="${{ inputs.format || 'auto' }}"
          if [ "${{ inputs.mode }}" = "test" ]; then
            python bot/main.py --dry-run --long "$FMT"
          else
            python bot/main.py --force --long "$FMT"
          fi
      - name: Keep the video for 2 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-${{ github.run_id }}
          path: out/long-*.mp4
          retention-days: 2
          if-no-files-found: ignore
      - name: Save history
        if: always()
        run: |
          git config user.name "ai-shorts-bot"
          git config user.email "ai-shorts-bot@users.noreply.github.com"
          git add state/ || true
          git diff --cached --quiet || (git commit -m "bot: upload log" && (git push || (git pull --rebase && git push)))
