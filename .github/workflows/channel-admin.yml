name: Channel admin (list / delete a video)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "kids or pk"
        type: choice
        options: [pk, kids]
        default: pk
      action:
        type: choice
        options: [list, delete]
        default: list
      video_id:
        description: "only for delete"
        default: ""

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHANNEL: ${{ inputs.channel }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT2_CLIENT_ID: ${{ secrets.YT2_CLIENT_ID }}
      YT2_CLIENT_SECRET: ${{ secrets.YT2_CLIENT_SECRET }}
      YT2_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/channel_admin.py ${{ inputs.action }} ${{ inputs.video_id }}
